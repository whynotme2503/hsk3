<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÀI TẬP BÀI 1 HSK3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; user-select: none; }
    </style>
</head>
<body class="bg-[#f5fbf7] min-h-screen text-slate-800 p-3 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-lg overflow-hidden border border-[#e2f2eb]">
        
        <!-- HEADER -->
        <header class="bg-[#52ab98] text-white p-6 md:p-8 text-center relative space-y-2">
            <h1 class="text-3xl md:text-4xl font-black tracking-wide">BÀI TẬP BÀI 1 HSK3</h1>
            <div class="text-xs md:text-sm font-semibold bg-[#2b675b]/30 inline-block px-4 py-1.5 rounded-full border border-white/20">
                <i class="fa-solid fa-phone mr-1.5 text-amber-300"></i> Liên hệ: 0799052526
            </div>
        </header>

        <!-- FORM NHẬP TÊN HỌC VIÊN -->
        <div id="step-user-info" class="p-6 md:p-10">
            <div class="max-w-md mx-auto bg-[#f5fbf7] p-6 md:p-8 rounded-2xl border border-[#e2f2eb] shadow-sm space-y-5">
                <div class="text-center space-y-1">
                    <h2 class="text-xl font-black text-[#2b675b]"><i class="fa-solid fa-user-pen text-[#52ab98] mr-2"></i>Thông Tin Học Viên</h2>
                    <p class="text-xs text-slate-500">Vui lòng nhập họ và tên để bắt đầu làm bài tập</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#2b675b] uppercase mb-1.5">Họ và tên (*):</label>
                    <input type="text" id="student-name" placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-4 py-3.5 rounded-xl border border-[#c2e2d5] focus:outline-none focus:ring-2 focus:ring-[#52ab98] font-bold text-slate-800 text-base bg-white">
                </div>
                <button onclick="startExercise()" class="w-full bg-[#52ab98] hover:bg-[#439382] active:scale-98 text-white font-black py-4 rounded-xl shadow-md transition text-base">
                    Bắt Đầu Làm Bài <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

        <!-- KHU VỰC BÀI TẬP (ẨN TRƯỚC KHI NHẬP TÊN) -->
        <div id="exercise-container" class="hidden p-4 md:p-8 space-y-10">

            <!-- THÔNG TIN VÀ ĐIỂM SỐ -->
            <div class="bg-[#f0f8f4] border-2 border-[#d5ece2] p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-3">
                <div class="text-[#2b675b] font-bold text-sm md:text-base">
                    <i class="fa-solid fa-user-check text-[#52ab98] mr-2"></i>Học viên: <span id="display-student-name" class="text-[#2b675b] font-black">---</span>
                </div>
                <div id="score-badge" class="hidden text-sm md:text-base font-black px-4 py-1.5 rounded-xl bg-[#52ab98] text-white shadow">
                    Kết quả: <span id="res-score">0 / 10</span> câu đúng
                </div>
            </div>

            <!-- PHẦN BÀI TẬP SẮP XẾP CÂU -->
            <section class="space-y-4">
                <div class="border-l-4 border-[#52ab98] pl-3 py-1">
                    <h2 class="text-xl font-black text-[#2b675b]">I. Bài tập sắp xếp câu (10 câu)</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Dùng bàn phím tiếng Trung gõ lại câu hoàn chỉnh từ các từ xáo trộn.</p>
                </div>
                <div id="questions-list" class="space-y-6"></div>
            </section>

            <!-- NÚT NỘP BÀI -->
            <div id="submit-section" class="pt-6 border-t border-[#f0f8f4] text-center space-y-3">
                <button onclick="submitAll()" class="w-full md:w-auto px-10 py-4 bg-[#52ab98] hover:bg-[#439382] active:scale-95 text-white font-black text-lg rounded-2xl shadow-lg transition">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp Bài & Xem Kết Quả
                </button>
                <p id="sheet-status-text" class="text-xs text-slate-500 font-medium"></p>
            </div>

        </div>

    </div>

    <!-- SCRIPT XỬ LÝ -->
    <script>
        // LINK GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1PELSmwOVSCTeV6UEkaQ3lGcMxbLoBaVakuxCLM8Pr-WW00oB4UuCLULLQK5XbrwSRA/exec";

        // DỮ LIỆU 10 CÂU SẮP XẾP CÂU VÀ ĐÁP ÁN CHUẨN
        const questionsData = [
            { 
                id: 1, 
                words: "不见了 / 那个黑色行李箱 / 昨天 / 房间中间 / 我 / 放在 / 的", 
                ans: "我昨天放在房间中间的那个黑色行李箱不见了。" 
            },
            { 
                id: 2, 
                words: "是谁 / 那个短头发的年轻人 / 服务台旁边 / 站在 / 的", 
                ans: "站在服务台旁边的那个短头发的年轻人是谁？" 
            },
            { 
                id: 3, 
                words: "都很年轻 / 那三个中国朋友 / 去年 / 我 / 在学校 / 认识 / 的", 
                ans: "我去年在学校认识的那三个中国朋友都很年轻。" 
            },
            { 
                id: 4, 
                words: "在哪儿 / 那个有号码的小箱子 / 昨天 / 朋友 / 给 / 我的", 
                ans: "昨天朋友给我的那个有号码的小箱子在哪儿？" 
            },
            { 
                id: 5, 
                words: "站在中间 / 那个身高一米八的男人 / 是 / 谁 / 的", 
                ans: "站在中间的那个身高一米八的男人是谁？" 
            },
            { 
                id: 6, 
                words: "我 / 以为 / 那个年轻人 / 是 / 来接 / 我的", 
                ans: "我以为那个年轻人是来接我的。" 
            },
            { 
                id: 7, 
                words: "好像不见了 / 放在 / 那个重要的护照 / 黑色行李箱里 / 的", 
                ans: "放在黑色行李箱里的那个重要的护照好像不见了。" 
            },
            { 
                id: 8, 
                words: "是你的朋友吗 / 昨天 / 那个有点儿瘦的男人 / 我 / 在服务台 / 看到 / 身高一米七五 / 的", 
                ans: "昨天我在服务台看到的那个身高一米七五、有点儿瘦的男人是你的朋友吗？" 
            },
            { 
                id: 9, 
                words: "昨天 / 有号码 / 那个年轻男人 / 站在中间 / 给 / 我的 / 行李箱 / 的", 
                ans: "昨天站在中间的那个年轻男人给我的行李箱有号码。" 
            },
            { 
                id: 10, 
                words: "好像还没来 / 我 / 那个长头发的中国朋友 / 让 / 来车站接 / 我的 / 的", 
                ans: "我让来车站接我的那个长头发的中国朋友好像还没来。" 
            }
        ];

        let studentName = "";

        function startExercise() {
            studentName = document.getElementById('student-name').value.trim();
            if (!studentName) {
                alert("Vui lòng nhập họ và tên của bạn!");
                return;
            }
            document.getElementById('display-student-name').innerText = studentName;
            document.getElementById('step-user-info').classList.add('hidden');
            document.getElementById('exercise-container').classList.remove('hidden');

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-list');
            container.innerHTML = questionsData.map(item => `
                <div class="bg-[#f9fcfa] p-5 rounded-2xl border border-[#e2f2eb] space-y-3" id="q-box-${item.id}">
                    <div class="font-bold text-slate-800 text-base md:text-lg">
                        <span class="text-[#2b675b] mr-1.5">Câu ${item.id}.</span> Các từ: <span class="text-indigo-700 font-mono bg-indigo-50 px-2 py-1 rounded text-sm md:text-base">${item.words}</span>
                    </div>
                    <textarea id="q-ans-${item.id}" rows="2" placeholder="Gõ câu hoàn chỉnh bằng tiếng Trung..." class="w-full p-4 rounded-xl border border-[#c2e2d5] focus:outline-none focus:ring-2 focus:ring-[#52ab98] font-medium text-base text-slate-800 bg-white leading-relaxed"></textarea>
                    
                    <!-- Vùng đối chiếu kết quả sau khi nộp -->
                    <div id="q-ref-${item.id}" class="hidden space-y-2 pt-2 border-t border-slate-200">
                        <div class="p-3 bg-white rounded-xl border border-slate-200 text-sm">
                            <span class="font-bold text-slate-500 block text-xs mb-1">✍ Bài làm của bạn:</span>
                            <span id="user-ans-text-${item.id}" class="font-medium text-slate-800"></span>
                        </div>
                        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-sm">
                            <span class="font-bold text-emerald-700 block text-xs mb-1">✔ Đáp án chuẩn:</span>
                            <span class="font-bold text-emerald-900">${item.ans}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Hàm làm sạch chuỗi để so sánh linh hoạt (bỏ dấu câu, khoảng trắng)
        function cleanText(str) {
            if (!str) return "";
            return str.replace(/[，。？！、\s“”""''’‘!！?？]/g, "").trim().toLowerCase();
        }

        function submitAll() {
            try {
                let totalCorrect = 0;
                let detailsText = [];

                questionsData.forEach(item => {
                    const textarea = document.getElementById(`q-ans-${item.id}`);
                    const box = document.getElementById(`q-box-${item.id}`);
                    const refBox = document.getElementById(`q-ref-${item.id}`);
                    const userAnsText = document.getElementById(`user-ans-text-${item.id}`);

                    if (!textarea || !box || !refBox || !userAnsText) return;

                    const userVal = textarea.value.trim();
                    const displayVal = userVal || "(Chưa làm)";
                    const isCorrect = cleanText(userVal) === cleanText(item.ans);

                    if (isCorrect) totalCorrect++;

                    textarea.disabled = true;
                    textarea.classList.add('hidden');
                    refBox.classList.remove('hidden');
                    userAnsText.innerText = displayVal;

                    if (isCorrect) {
                        box.className = "bg-emerald-50/90 p-5 rounded-2xl border-2 border-emerald-400 space-y-3";
                    } else {
                        box.className = "bg-rose-50/90 p-5 rounded-2xl border-2 border-rose-300 space-y-3";
                    }

                    detailsText.push(`[Câu ${item.id}] Gõ: [${displayVal}] (${isCorrect ? 'ĐÚNG' : 'SAI'})`);
                });

                // Hiển thị tổng điểm
                const scoreBadge = document.getElementById('score-badge');
                const resScore = document.getElementById('res-score');
                if (scoreBadge && resScore) {
                    scoreBadge.classList.remove('hidden');
                    resScore.innerText = `${totalCorrect} / 10`;
                    scoreBadge.scrollIntoView({ behavior: 'smooth' });
                }

                // GỬI KẾT QUẢ NGẦM VỀ GOOGLE SHEETS BẰNG SENDBEACON (4 CỘT)
                const statusText = document.getElementById('sheet-status-text');
                if (statusText) {
                    statusText.innerText = "⏳ Đang đồng bộ kết quả về hệ thống...";
                }

                const payload = {
                    lessonName: "Bài 1 HSK3",
                    studentName: studentName,
                    score: `${totalCorrect} / 10`,
                    details: detailsText.join(" || "),
                    submittedAt: new Date().toLocaleString()
                };

                const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
                
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(SCRIPT_URL, blob);
                    if (statusText) {
                        statusText.innerText = "✅ Đã lưu kết quả thành công vào Google Sheets!";
                        statusText.className = "text-xs font-bold text-[#2b675b] mt-2";
                    }
                } else {
                    fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: blob }).then(() => {
                        if (statusText) {
                            statusText.innerText = "✅ Đã lưu kết quả thành công vào Google Sheets!";
                            statusText.className = "text-xs font-bold text-[#2b675b] mt-2";
                        }
                    });
                }

                const submitBtn = document.querySelector('#submit-section button');
                if (submitBtn) {
                    submitBtn.classList.add('hidden');
                }
            } catch (err) {
                console.error("Lỗi khi nộp bài:", err);
                alert("Có lỗi xảy ra khi nộp bài, vui lòng kiểm tra lại console.");
            }
        }
    </script>
</body>
</html>
