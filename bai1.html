<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÀI TẬP BÀI 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; user-select: none; }
    </style>
</head>
<body class="bg-[#f5fbf7] min-h-screen text-slate-800 p-3 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-lg overflow-hidden border border-[#e2f2eb]">
        
        <!-- HEADER -->
        <header class="bg-[#52ab98] text-white p-6 md:p-8 text-center relative space-y-2">
            <h1 class="text-3xl md:text-4xl font-black tracking-wide">BÀI TẬP BÀI 1</h1>
            <div class="text-xs md:text-sm font-semibold bg-[#2b675b]/30 inline-block px-4 py-1.5 rounded-full border border-white/20">
                <i class="fa-solid fa-phone mr-1.5 text-amber-300"></i> Liên hệ: 0799052526
            </div>
        </header>

        <!-- FORM NHẬP TÊN HỌC VIÊN -->
        <div id="step-user-info" class="p-6 md:p-10">
            <div class="max-w-md mx-auto bg-[#f5fbf7] p-6 md:p-8 rounded-2xl border border-[#e2f2eb] shadow-sm space-y-5">
                <div class="text-center space-y-1">
                    <h2 class="text-xl font-black text-[#2b675b]"><i class="fa-solid fa-user-pen text-[#52ab98] mr-2"></i>Thông Tin Học Viên</h2>
                    <p class="text-xs text-slate-500">Vui lòng nhập tên để bắt đầu làm bài tập</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#2b675b] uppercase mb-1.5">Họ và tên (*):</label>
                    <input type="text" id="student-name" placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-4 py-3.5 rounded-xl border border-[#c2e2d5] focus:outline-none focus:ring-2 focus:ring-[#52ab98] font-bold text-slate-800 text-base bg-white">
                </div>
                <button onclick="startExercise()" class="w-full bg-[#52ab98] hover:bg-[#439382] active:scale-98 text-white font-black py-4 rounded-xl shadow-md transition text-base">
                    Bắt Đầu Làm Bài <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

        <!-- KHU VỰC BÀI TẬP -->
        <div id="exercise-container" class="hidden p-4 md:p-8 space-y-8">

            <!-- THANH THÔNG TIN HỌC VIÊN -->
            <div id="summary-bar" class="bg-[#f0f8f4] border-2 border-[#d5ece2] p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-3">
                <div class="text-[#2b675b] font-bold text-sm md:text-base">
                    <i class="fa-solid fa-user-check text-[#52ab98] mr-2"></i>Học viên: <span id="display-student-name" class="text-[#2b675b] font-black">---</span>
                </div>
                <div id="score-badge" class="hidden text-sm md:text-base font-black px-4 py-1.5 rounded-xl bg-[#52ab98] text-white shadow">
                    Trạng thái: Đã nộp bài
                </div>
            </div>

            <!-- ĐỀ BÀI 10 CÂU DỊCH -->
            <section class="space-y-4">
                <div class="border-l-4 border-[#52ab98] pl-3 py-1">
                    <h2 class="text-xl font-black text-[#2b675b]">Dịch các câu sau sang tiếng Trung</h2>
                </div>
                <div id="questions-list" class="space-y-5"></div>
            </section>

            <!-- NÚT NỘP BÀI -->
            <div id="submit-section" class="pt-6 border-t border-[#f0f8f4] text-center space-y-3">
                <button onclick="submitAll()" class="w-full md:w-auto px-10 py-4 bg-[#52ab98] hover:bg-[#439382] active:scale-95 text-white font-black text-lg rounded-2xl shadow-lg transition">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp Bài & Đối Chiểu Kết Quả
                </button>
                <p id="sheet-status-text" class="text-xs text-slate-500 font-medium"></p>
            </div>

            <!-- FOOTER -->
            <footer class="text-center text-xs text-[#52ab98] pt-6 border-t border-[#f0f8f4] font-medium">
                © HSK Online Platform — Liên hệ hỗ trợ: <span class="font-bold text-[#2b675b]">0799052526</span>
            </footer>

        </div>

    </div>

    <!-- SCRIPT XỬ LÝ -->
    <script>
        // LINK GOOGLE APPS SCRIPT ẨN
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwe36ezJGUGGOFfmAvjLOtZfJjCDw_Hd8MKs_zAOsFqMcSU5yZPBrgqM382XpyJ_o_sIw/exec";

        const questionsData = [
            { id: 1, vn: "Con đường này rất dài, chúng tôi đi một tiếng rồi mà vẫn chưa đến.", cn: "这条路很长，我们走了一个小时还没到。" },
            { id: 2, vn: "Hành lý của tôi vẫn ở trên xe, tôi phải quay lại lấy một chút.", cn: "我的行李还在车上，我要回去拿一下。" },
            { id: 3, vn: "Tôi cứ tưởng hôm nay bạn không đến lớp nữa.", cn: "我以为你今天不来上课了。" },
            { id: 4, vn: "Sao bạn gầy đi vậy? Có phải công việc quá bận không?", cn: "你怎么瘦了？是不是工作太忙了？" },
            { id: 5, vn: "Chiều nay tôi phải đến sân bay đón một người bạn từ Trung Quốc sang.", cn: "我下午要去机场接一个从中国来的朋友。" },
            { id: 6, vn: "Sau khi về đến nhà, phát hiện điện thoại không thấy đâu nữa.", cn: "我回到家以后，发现手机不见了。" },
            { id: 7, vn: "Bạn đứng ở đây một lát, tôi đi mua hai tấm vé.", cn: "你在这里站一下，我去买张电影票。" },
            { id: 8, vn: "Mặc dù anh ấy đã 40 tuổi nhưng trông vẫn rất trẻ.", cn: "虽然他已经四十岁了，但是看起来很年轻。" },
            { id: 9, vn: "Cảm ơn bạn hôm qua đã giúp tôi tìm vali.", cn: "谢谢你昨天帮助我找行李箱。" },
            { id: 10, vn: "Hôm nay trông bạn rất mệt, tối qua ngủ không ngon à?", cn: "你今天看起来很累，昨晚没睡好吗？" }
        ];

        let studentName = "";

        function startExercise() {
            studentName = document.getElementById('student-name').value.trim();
            if (!studentName) {
                alert("Vui lòng nhập họ và tên của bạn!");
                return;
            }
            document.getElementById('display-student-name').innerText = studentName;
            document.getElementById('step-user-info').classList.add('hidden');
            document.getElementById('exercise-container').classList.remove('hidden');

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-list');
            container.innerHTML = questionsData.map(item => `
                <div class="bg-[#f9fcfa] p-4 md:p-5 rounded-2xl border border-[#e2f2eb] space-y-3" id="q-box-${item.id}">
                    <div class="flex items-start justify-between gap-3">
                        <div class="font-bold text-slate-800 text-base md:text-lg pt-1">
                            <span class="text-[#2b675b] mr-1.5">${item.id}.</span>${item.vn}
                        </div>
                        <button onclick="playAudio(${item.id})" title="Phát âm thanh" class="flex-shrink-0 w-11 h-11 bg-[#52ab98] hover:bg-[#439382] active:scale-90 text-white rounded-xl shadow-md transition flex items-center justify-center text-xl">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                    <textarea id="ans-${item.id}" rows="2" placeholder="Nhập câu dịch Tiếng Trung của bạn..." class="w-full p-3.5 rounded-xl border border-[#c2e2d5] focus:outline-none focus:ring-2 focus:ring-[#52ab98] font-medium text-base text-slate-800 bg-white"></textarea>
                    
                    <!-- VÙNG HIỂN THỊ ĐỐI CHIẾU SAU KHI NỘP -->
                    <div id="ref-box-${item.id}" class="hidden space-y-2 pt-2 border-t border-slate-200">
                        <div class="p-3 bg-white rounded-xl border border-slate-200 text-sm">
                            <span class="font-bold text-slate-500 block text-xs mb-1">✍ Bài làm của bạn:</span>
                            <span id="user-ans-text-${item.id}" class="font-medium text-slate-800"></span>
                        </div>
                        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-sm">
                            <span class="font-bold text-emerald-700 block text-xs mb-1">✔ Đáp án chuẩn:</span>
                            <span class="font-bold text-emerald-900">${item.cn}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Định dạng file âm thanh chuẩn có dấu cách: "1 .mp3", "2 .mp3"...
        function playAudio(id) {
            const audio = new Audio(`${id} .mp3`);
            audio.play().catch(e => {
                alert(`Không tìm thấy file âm thanh: ${id} .mp3! Hãy đảm bảo tên file đúng định dạng và đặt cùng thư mục.`);
            });
        }

        function submitAll() {
            let detailsText = [];

            questionsData.forEach(item => {
                const textarea = document.getElementById(`ans-${item.id}`);
                const box = document.getElementById(`q-box-${item.id}`);
                const refBox = document.getElementById(`ref-box-${item.id}`);
                const userAnsText = document.getElementById(`user-ans-text-${item.id}`);

                const userVal = textarea.value.trim();
                const displayVal = userVal || "(Chưa làm)";
                
                const isCorrect = userVal.replace(/\s+/g, '') === item.cn.replace(/\s+/g, '');

                textarea.disabled = true;
                textarea.classList.add('hidden');
                refBox.classList.remove('hidden');
                userAnsText.innerText = displayVal;

                if (isCorrect && userVal !== "") {
                    box.className = "bg-emerald-50/80 p-4 md:p-5 rounded-2xl border-2 border-emerald-300 space-y-3";
                } else {
                    box.className = "bg-rose-50/80 p-4 md:p-5 rounded-2xl border-2 border-rose-300 space-y-3";
                }

                detailsText.push(`Câu ${item.id} | HS làm: [${displayVal}] | Đáp án: ${item.cn} | ${isCorrect ? 'ĐÚNG' : 'CHƯA KHỚP'}`);
            });

            document.getElementById('score-badge').classList.remove('hidden');
            document.getElementById('summary-bar').scrollIntoView({ behavior: 'smooth' });

            const statusText = document.getElementById('sheet-status-text');
            statusText.innerText = "⏳ Đang đồng bộ kết quả về hệ thống...";

            const payload = {
                studentName: studentName,
                details: detailsText.join(" || "),
                submittedAt: new Date().toLocaleString()
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                statusText.innerText = "✅ Đã lưu kết quả thành công vào Google Sheets!";
                statusText.className = "text-xs font-bold text-[#2b675b] mt-2";
            }).catch(() => {
                statusText.innerText = "❌ Lỗi kết nối Google Sheets (Vui lòng kiểm tra lại mạng).";
                statusText.className = "text-xs font-bold text-rose-600 mt-2";
            });

            document.getElementById('submit-section').querySelector('button').classList.add('hidden');
        }
    </script>
</body>
</html>
